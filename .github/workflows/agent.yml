name: 3D Site Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the 3D website you want"
        required: true
        default: "Build a luxury Indian biryani restaurant website"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: pip install requests

    - name: Run Agent
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        SITE_PROMPT: ${{ github.event.inputs.prompt }}
      run: python agent.py

    - name: Push site to GitHub
      run: |
        git config user.name "AgentBot"
        git config user.email "agent@bot.com"
        git add index.html
        git diff --staged --quiet || git commit -m "Built: R Bawarchi site"
        git push