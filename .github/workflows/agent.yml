name: Universal 3D Premium Site Builder

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe ANY premium 3D website you want"
        required: true
        default: "Build a futuristic AI SaaS landing page"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Universal 3D Site Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_PROMPT: ${{ github.event.inputs.prompt }}
        run: python agent.py

      - name: Commit & Push Generated Website
        run: |
          git config user.name "3DSiteAgent"
          git config user.email "agent@3dsite.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Generated site: ${{ github.event.inputs.prompt }}"
          git push