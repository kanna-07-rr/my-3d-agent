name: Universal 3D Premium Site Builder

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe ANY premium 3D website you want"
        required: true
        default: "Build a futuristic AI SaaS landing page"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Universal 3D Site Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_PROMPT: ${{ github.event.inputs.prompt }}
        run: python agent.py

      - name: Commit & Push Generated Website
  shell: bash
  run: |
    git config --global user.name "3DSiteAgent"
    git config --global user.email "agent@3dsite.com"

    git add .

    PROMPT="${{ github.event.inputs.prompt }}"
    SAFE_PROMPT=$(echo "$PROMPT" | tr '\n\r' ' ' | sed 's/[^a-zA-Z0-9 ]//g' | cut -c1-50)

    if git diff --cached --quiet; then
      echo "No changes to commit"
    else
      git commit -m "Generated: $SAFE_PROMPT"
      git push
    fi