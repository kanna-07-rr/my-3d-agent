name: Universal 3D Premium Site Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the 3D animated website you want to build"
        required: true
        default: "Build a premium minimalist coffee brand website with floating 3D coffee beans"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

  steps:  
    - name: Checkout  
      uses: actions/checkout@v4  

    - name: Setup Python  
      uses: actions/setup-python@v5  
      with:  
        python-version: "3.11"  

    - name: Install dependencies  
      run: pip install requests  

    - name: Run 3D Site Agent  
      env:  
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  
        SITE_PROMPT: ${{ github.event.inputs.prompt }}  
      run: python agent.py  

    - name: Push site to GitHub  
      run: |  
        git config user.name "3D-AgentBot"  
        git config user.email "agent@bot.com"  
        git add index.html  
        git diff --staged --quiet || git commit -m "Auto-Built: ${{ github.event.inputs.prompt }}"  
        git push