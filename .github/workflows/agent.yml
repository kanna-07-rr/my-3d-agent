name: 3D Site Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the 3D website"
        required: true
        default: "Premium 3D space portfolio"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_PROMPT: ${{ github.event.inputs.prompt }}
        run: python agent.py

      - name: Commit Output
        run: |
          git config user.name "AgentBot"
          git config user.email "bot@agent.com"
          git add index.html
          git commit -m "Build site" || echo "No changes"
          git push