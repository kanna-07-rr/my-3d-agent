<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
--style --primary --secondary
font-family: 'Playfair Display', sans-serif;
font-size: 2rem;
font-weight: 600;
color: #fff;

:root {
  --bg-color: #0a0a0a;
  --primary: #FFD700;
  --secondary: #ff6b35;
  --text-color: #fff;
  --gloss: rgba(0,0,0,0.05);
}

body {
  margin: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: 'Inter', sans-serif;
  line-height: 1.6;
  padding: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.05)), url('https://cdnjs.cloudflare.com/ajax/libs/playfair-design/0.9.0/Playfair-Regular.current.css');
  background-size: cover;
  background-position: center;
  animation: fadeIn 4s ease-in;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.hero h1 {
  font-bold;
  margin-bottom: 2rem;
  color: var(--secondary);
  animation: fadeIn 2s ease-out;
}

.hero p {
  font-size: 1.8rem;
  margin-bottom: 1.5rem;
  color: var(--text-color);
  animation: float 2s ease;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.btn {
  padding: 1rem 2rem;
  background-color: var(--primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Playfair Display', sans-serif;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background-color 0.3s, color 0.3s;
  outline: none;
  outline-offset: 2px;
}

.btn:hover {
  background-color: var(--secondary);
  color: #fff;
}

.sections {
  padding: 4rem 2rem;
  background-color: rgba(0,0,0,0.1);
  color: var(--primary);
}

@media (max-width: 768px) {
  .hero h1 {
    font-size: 2rem;
  }
  .hero p {
    font-size: 1.2rem;
  }
  .btn {
    padding: 0.8rem 1.5rem;
  }
}

@media (max-width: 480px) {
  .hero {
    height: auto;
    padding: 2rem;
  }
  .sections {
    padding: 1rem;
  }
}

button {
  padding: 0.75rem 1.5rem;
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.3s;
}

button:hover {
  opacity: 0.9;
}

/* Glassmorphism effects */
.sections {
  background: rgba(0,0,0,0.1);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* Animations */
.hero {
  transform: translateZ(0);
}

/* Responsive scrollbar */
::-webkit-scrollbar {
  width: 12px;
}

::-webkit-scrollbar-thumb {
  background: var(--secondary);
  border-radius: 4px;
}

/* Cursor glow */
a {
  text-decoration: none;
  color: var(--text-color);
  transition: color 0.3s;
}

a:hover {
  color: var(--primary);
}
    </style>
</head>
<body>
<div style="background-color: #0a0a0a; color: #FFD700;"></div>
    <script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Solar System</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; }
h1 { color: #FFD700; }
</style>
</head>
<body>

<h1>3D Solar System</h1>

<div id="scene"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/scroll-trigger/3.2.1/scroll-trigger.min.js"></script>

<script>
// Hero Section
document.getElementById('scene').style.backgroundColor = '#0a0a0a';
document.body.style.color = '#ffd700';

// 3D sections
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 100;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('scene').appendChild(renderer.domElement);

// Create Sun
const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
const sunMaterial = new THREE.MeshBasicMaterial({ color: '#FFD700' });
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

// Add planets with GSAP animations
const planets = [
    { name: 'Mercury', r: 1, speed: 0.1, color: '#333', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * planets.speed) * 100, y: Math.sin(Math.PI * planets.speed) * 100, duration: 2 }) },
    { name: 'Venus', r: 1.5, speed: 0.15, color: '#FFD700', animation: () => gsap.to(sun.position, { x: 0, y: 0 }) },
    { name: 'Earth', r: 2, speed: 0.2, color: '#FFD700', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * 0.1) * 150, y: Math.sin(Math.PI * 0.1) * 150, duration: 2 }) },
    { name: 'Mars', r: 1.8, speed: 0.2, color: '#FFD700', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * 0.35) * 120, y: Math.sin(Math.PI * 0.35) * 120, duration: 2 }) },
    { name: 'Jupiter', r: 5, speed: 0.25, color: '#FFD700', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * 0.5) * 200, y: Math.sin(Math.PI * 0.5) * 200, duration: 2 }) },
    { name: 'Saturn', r: 5, speed: 0.3, color: '#FFD700', animation: () => gsap.to(sun.position, { x: 0, y: Math.sin(Math.PI * 0.8) * 180, duration: 3 }) },
    { name: 'Uranus', r: 4, speed: 0.3, color: '#FFD700', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * 0.9) * 220, y: 0, duration: 3 }) },
    { name: 'Neptune', r: 4, speed: 0.35, color: '#FFD700', animation: () => gsap.to(sun.position, { x: Math.cos(Math.PI * 1.3) * 250, y: Math.sin(Math.PI * 1.3) * 250, duration: 4 }) }
];

// Magnetic buttons
const buttons = [];
for (let i = 0; i < 3; i++) {
    const button = document.createElement('button');
    button.className = 'magnetic-button';
    button.style.position = 'absolute';
    button.style.border = 'none';
    button.style.cursor = 'pointer';
    button.style.fontSize = '12px';
    button.style.backgroundColor = '#FFD700';
    button.style.color = '#0a0a0a';
    button.style.padding = '10px';
    button.style.zIndex = 1000;
    button.addEventListener('click', () => gsap.to(buttons[i].style.backgroundColor, { duration: 0.3, opacity: 0.5 });
    scene.add(button);
    buttons.push(button);
}

// ScrollTrigger for mobile
const trigger = new ScrollTrigger({ trigger: 'scroll', start: 0, end: 100 });
trigger.load();
window.addEventListener('scroll', () => {
    if (window.innerHeight > 0 && window.pageYOffset > 0) {
        gsap.to(scene, { scrollTo: { x: 0, y: 0 }, duration: 0.5 });
    }
});

// Add glow to cursor
const glow = new THREE.ConeLight();
glow.position.set(0, 0, 0);
glow.color = '#FFD700';
glow.shadowSize = 20;
sun.add(glow);

camera.position.z = 1000;

// Mobile fallback
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
    </script>
</body>
</html>
