<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RR Cars 3D Showroom</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            text-align: center; color: #fff; }
        #controls button { padding: 10px 20px; margin: 0 10px; font-family: sans-serif; cursor: pointer;
            border: 1px solid #444; transition: background 0.3s; background: rgba(0,0,0,0.5); }
        #controls button:hover { background: rgba(255,0,0,0.6); }
        #title { position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            font-family: 'Courier New', Courier, monospace; font-size: 40px; text-align: center;
            color: #0ff; animation: scale 2s infinite; }
        @keyframes scale { 0% { transform: translateX(-50%) scale(1); }
                          50% { transform: translateX(-50%) scale(1.1); }
                          100% { transform: translateX(-50%) scale(1); } }
    </style>
</head>
<body>
    <div id="title">RR Cars</div>
    <div id="controls">
        <button onclick="rotateCar()">Rotate Car</button>
        <button onclick="toggleNeon()">Neon Lights</button>
    </div>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js';
        import { LineSegments, LineBasicMaterial, MeshBasicMaterial, Vector3 } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';

        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({canvas});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        scene.add(new THREE.AmbientLight(0x404040));

        const loader = new GLTFLoader();
        let carModel, neonActive = true;
        let orbitControls;

        loader.load('https://threejs.org/examples/models/gltf/Mercedes-AMG/mercedes-amg.gltf', (gltf) => {
            carModel = gltf.scene;
            carModel.position.set(0, -1.5, 0);
            scene.add(carModel);
            
            camera.position.set(0, 2, 5);
            orbitControls = new OrbitControls(camera, canvas);
            orbitControls.enableDamping = true;
            orbitControls.rotateSpeed = 0.05;
            orbitControls.zoomSpeed = 0.5;
            orbitControls.dampingFactor = 0.5;
            
            requestAnimationFrame(animate);
        });

        function rotateCar() {
            if(carModel) {
                carModel.rotation.y += Math.PI / 4;
            }
        }

        function toggleNeon() {
            neonActive = !neonActive;
            for(let lane of neonLanes) {
                lane.material.visible = neonActive;
            }
        }

        const neonLanes = [];
        function createNeonLights(geometry, color) {
            const lineMaterial = new LineBasicMaterial({ color });
            const lineSegments = new LineSegments(geometry, lineMaterial);
            scene.add(lineSegments);
            neonLanes.push(lineSegments);
            return lineSegments;
        }

        function animate() {
            renderer.clear();
            if(carModel) {
                carModel.rotation.y += 0.01;
            }
            if(neonActive) {
                updateNeonPulse();
            }
            requestAnimationFrame(animate);
        }

        function updateNeonPulse() {
            for(let i = 0; i < neonLanes.length; i++) {
                neonLanes[i].children[i].scale.x = Math.sin(Date.now() * 0.002 + i) * 1.2 + 0.8;
            }
        }

        function addNeonStrip() {
            const points = [];
            // Car roof
            points.push(new Vector3(-3.5, 1.5, -1.5));
            points.push(new Vector3(3.5, 1.5, -1.5));
            createNeonLights(new THREE.BufferGeometry().setFromPoints(points), 0x00ffcc);
            
            // Car light lines
            const leftLights = [new Vector3(-1.5, 1.5, -1.5), new Vector3(-1.5, 1.5, 1.5)];
            const rightLights = [new Vector3(1.5, 1.5, -1.5), new Vector3(1.5, 1.5, 1.5)];
            createNeonLights(new THREE.BufferGeometry().setFromPoints(leftLights), 0xff00ff);
            createNeonLights(new THREE.BufferGeometry().setFromPoints(rightLights), 0x00ffff);
        }

        addNeonStrip();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
