:root {
  --bg: #080503;
  --primary: #C9A84C;
  --secondary: #8B2500;
  --accent: #F4D03F;
  --text-light: #f5f0e8;
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
}

body {
  background-color: var(--bg);
  color: var(--text-light);
  font-family: 'Cormorant Garamond', serif;
  line-height: 1.7;
}

.nav {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  padding: 1.5rem 5%;
  background: rgba(15, 10, 5, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(201, 168, 76, 0.1);
}

.nav .logo {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 900;
  color: var(--primary);
  text-decoration: none;
}

.nav ul {
  list-style: none;
  display: flex;
  gap: 2rem;
}

.nav ul li a {
  color: var(--text-light);
  text-decoration: none;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  transition: color 0.3s ease;
}

.nav ul li a:hover {
  color: var(--primary);
}

section {
  min-height: 100vh;
  padding: 80px 5%;
  position: relative;
  overflow: hidden;
}

.hero {
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  min-height: calc(100vh - 80px); /* Adjust for nav height */
}

.hero canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 800px;
  margin: 0 auto;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3rem, 8vw, 7rem);
  color: var(--primary);
  margin-bottom: 1rem;
  line-height: 1.1;
}

h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 4rem);
  margin-bottom: 2rem;
  line-height: 1.2;
  color: var(--text-light);
}

h3 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.5rem, 3vw, 2.5rem);
  margin-bottom: 1rem;
  color: var(--primary);
}

p {
  font-size: 1.1rem;
  margin-bottom: 1rem;
}

.btn-primary {
  display: inline-block;
  padding: 1rem 3rem;
  background: var(--primary);
  color: #000;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  text-decoration: none;
  border-radius: 5px;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(10deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.3s ease;
}

.btn-primary:hover {
  background: var(--accent);
  transform: translateY(-2px);
}

.btn-primary:hover::before {
  left: 100%;
}

.btn-secondary {
  display: inline-block;
  padding: 1rem 3rem;
  background: transparent;
  color: var(--primary);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  border: 2px solid var(--primary);
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  text-decoration: none;
  border-radius: 5px;
}

.btn-secondary:hover {
  background: var(--primary);
  color: #000;
  transform: translateY(-2px);
}

.glass {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(201, 168, 76, 0.2);
  border-radius: 12px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 2rem;
}

.menu-card {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(201, 168, 76, 0.15);
  border-radius: 16px;
  padding: 2rem;
  cursor: pointer;
  transition: all 0.4s ease;
  transform-style: preserve-3d;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.menu-card:hover {
  border-color: var(--primary);
  box-shadow: 0 20px 60px rgba(201, 168, 76, 0.2);
  transform: translateY(-8px) rotateY(2deg);
}

.menu-card h4 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  color: var(--primary);
  margin-bottom: 0.5rem;
}

.menu-card .price {
  font-weight: 700;
  color: var(--accent);
  margin-top: 1rem;
}

.testimonial-section {
  background: linear-gradient(rgba(8, 5, 3, 0.8), rgba(8, 5, 3, 0.8)), url('./images/testimonial-bg.jpg'); /* Replace with actual path */
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.testimonial-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(201, 168, 76, 0.2);
  border-radius: 16px;
  padding: 2rem;
  margin: 1rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.testimonial-card p {
  font-style: italic;
  max-width: 600px;
  margin: 0 auto 1rem auto;
}

.testimonial-card .author {
  font-weight: 700;
  color: var(--primary);
  margin-top: 1rem;
}

.form-section {
  background: rgba(15, 10, 5, 0.4);
}

form {
  max-width: 700px;
  margin: 0 auto;
}

.form-group {
  position: relative;
  margin-bottom: 2rem;
}

.form-group input,
.form-group textarea {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(201, 168, 76, 0.3);
  padding: 1rem 0;
  color: var(--text-light);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.3s ease;
  font-family: 'Cormorant Garamond', serif;
}

.form-group input:focus,
.form-group textarea:focus {
  border-bottom-color: var(--primary);
}

.form-label {
  position: absolute;
  top: 1rem;
  left: 0;
  color: rgba(245, 240, 232, 0.5);
  transition: all 0.3s ease;
  pointer-events: none;
}

input:focus ~ .form-label,
input:not(:placeholder-shown) ~ .form-label,
textarea:focus ~ .form-label,
textarea:not(:placeholder-shown) ~ .form-label {
  top: -0.5rem;
  font-size: 0.75rem;
  color: var(--primary);
}

textarea {
  min-height: 120px;
  resize: vertical;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  display: flex;
  opacity: 1;
}

.modal-box {
  background: #0f0a05;
  border: 1px solid var(--primary);
  border-radius: 20px;
  padding: 3rem;
  max-width: 500px;
  width: 90%;
  position: relative;
  transform: scale(0.9);
  animation: zoomIn 0.3s ease forwards;
}

.modal-box h3 {
  text-align: center;
  margin-bottom: 2rem;
}

.modal-box .btn-primary {
  width: 100%;
  margin-top: 1.5rem;
}

.modal-close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  background: none;
  border: none;
  font-size: 1.8rem;
  color: rgba(255, 255, 255, 0.6);
  cursor: pointer;
  transition: color 0.3s ease;
}

.modal-close-btn:hover {
  color: var(--primary);
}

@keyframes zoomIn {
  to {
    transform: scale(1);
  }
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: #111;
}

::-webkit-scrollbar-thumb {
  background: var(--primary);
  border-radius: 3px;
}

.divider {
  width: 80px;
  height: 2px;
  background: linear-gradient(to right, transparent, var(--primary), transparent);
  margin: 1.5rem auto;
}

footer {
  padding: 3rem 5%;
  text-align: center;
  background: #110d0a;
  font-size: 0.9rem;
  color: rgba(245, 240, 232, 0.7);
}

footer a {
  color: var(--primary);
  text-decoration: none;
}

/* Responsive */
@media (max-width: 1024px) {
  .nav ul {
    gap: 1rem;
  }
  .nav ul li a {
    font-size: 1rem;
  }
  h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
  }
  h2 {
    font-size: clamp(1.8rem, 4vw, 3rem);
  }
  .btn-primary, .btn-secondary {
    padding: 0.8rem 2rem;
    font-size: 0.9rem;
  }
}

@media (max-width: 768px) {
  .nav {
    padding: 1rem 5%;
  }
  .nav .logo {
    font-size: 1.5rem;
  }
  .nav ul {
    display: none; /* Hamburger menu logic would go here */
  }

  section {
    padding: 60px 5%;
    min-height: auto;
  }

  .hero {
    min-height: 60vh;
    align-items: center;
    justify-content: center;
  }

  .hero canvas {
    height: 70vh; /* Reduced height for smaller screens */
  }

  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    text-align: center;
  }
  h2 {
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    text-align: center;
  }

  .menu-grid {
    grid-template-columns: 1fr;
  }

  .menu-card {
    padding: 1.5rem;
  }

  .testimonial-card {
    margin: 0.5rem;
  }

  .modal-box {
    padding: 2rem;
  }
}

@media (max-width: 480px) {
  h1 {
    font-size: 2rem;
  }
  h2 {
    font-size: 1.3rem;
  }
  .btn-primary, .btn-secondary {
    padding: 0.8rem 1.5rem;
    font-size: 0.8rem;
    letter-spacing: 1px;
  }
  .menu-card h4 {
    font-size: 1.2rem;
  }
  .form-group input, .form-group textarea {
    font-size: 0.9rem;
  }
}

<script>

// ── CURSOR GLOW ──────────────────────────────────────────────
const cursor = document.createElement('div');
cursor.style.cssText = 'position:fixed;width:20px;height:20px;border-radius:50%;background:rgba(201,168,76,0.4);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform 0.1s,width 0.3s,height 0.3s;mix-blend-mode:screen;';
document.body.appendChild(cursor);
const cursorOuter = document.createElement('div');
cursorOuter.style.cssText = 'position:fixed;width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,168,76,0.3);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all 0.15s ease;';
document.body.appendChild(cursorOuter);
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
  cursorOuter.style.left = e.clientX + 'px';
  cursorOuter.style.top = e.clientY + 'px';
});
document.addEventListener('mousedown', () => { cursor.style.transform='translate(-50%,-50%) scale(0.7)'; });
document.addEventListener('mouseup', () => { cursor.style.transform='translate(-50%,-50%) scale(1)'; });

// ── SCROLL ANIMATIONS ─────────────────────────────────────────
if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
  gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray('section').forEach((sec, i) => {
    if (i === 0) return;
    gsap.fromTo(sec.querySelectorAll('h2, h3, p, .menu-card, .testimonial-card, .form-group'),
      { opacity: 0, y: 40 },
      { opacity: 1, y: 0, duration: 0.8, stagger: 0.1, ease: 'power3.out',
         scrollTrigger: { trigger: sec, start: 'top 80%', toggleActions: 'play none none none' }
      }
    );
  });
  gsap.from('.hero-content', { opacity:0, y:60, duration:1.2, ease:'power3.out', delay:0.5 });
  gsap.from('nav', { opacity:0, y:-30, duration:0.8, ease:'power3.out' });
}

// ── HERO THREE.JS ─────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('heroCanvas');
  if (!canvas || typeof THREE === 'undefined') return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 100);
  camera.position.set(0, 0, 5);

  // Bowl base
  const bowlGeo = new THREE.SphereGeometry(1.5, 32, 32, 0, Math.PI*2, 0, Math.PI/2);
  const bowlMat = new THREE.MeshPhongMaterial({ color:0x3d1a00, shininess:80, specular:0xC9A84C });
  const bowl = new THREE.Mesh(bowlGeo, bowlMat);
  bowl.rotation.x = 0.2;
  scene.add(bowl);

  // Rice layer
  const riceGeo = new THREE.SphereGeometry(1.4, 32, 16, 0, Math.PI*2, 0, Math.PI/2.5);
  const riceMat = new THREE.MeshPhongMaterial({ color:0xf5e6c8, shininess:30 });
  const rice = new THREE.Mesh(riceGeo, riceMat);
  rice.position.y = 0.1;
  scene.add(rice);

  // Saffron top layer
  const saffronGeo = new THREE.SphereGeometry(1.35, 32, 16, 0, Math.PI*2, 0, Math.PI/3);
  const saffronMat = new THREE.MeshPhongMaterial({ color:0xC9A84C, shininess:20 });
  const saffron = new THREE.Mesh(saffronGeo, saffronMat);
  saffron.position.y = 0.25;
  scene.add(saffron);

  // Steam particles
  const particleCount = 200;
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];
  for (let i = 0; i < particleCount; i++) {
    positions[i*3]   = (Math.random()-0.5) * 2;
    positions[i*3+1] = Math.random() * 3 + 1;
    positions[i*3+2] = (Math.random()-0.5) * 2;
    velocities.push({ x:(Math.random()-0.5)*0.003, y:0.005+Math.random()*0.008, z:(Math.random()-0.5)*0.003 });
  }
  const particleGeo = new THREE.BufferGeometry();
  particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const particleMat = new THREE.PointsMaterial({ color:0xf5f0e8, size:0.06, transparent:true, opacity:0.4 });
  const particles = new THREE.Points(particleGeo, particleMat);
  scene.add(particles);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x442200, 0.8);
  scene.add(ambientLight);
  const pointLight1 = new THREE.PointLight(0xC9A84C, 2, 10);
  pointLight1.position.set(3, 4, 3);
  scene.add(pointLight1);
  const pointLight2 = new THREE.PointLight(0x8B2500, 1, 10);
  pointLight2.position.set(-3, -2, 2);
  scene.add(pointLight2);

  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01;
    bowl.rotation.y += 0.004;
    rice.rotation.y += 0.004;
    saffron.rotation.y += 0.003;
    // Animate particles
    const pos = particleGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i*3]   += velocities[i].x;
      pos[i*3+1] += velocities[i].y;
      pos[i*3+2] += velocities[i].z;
      if (pos[i*3+1] > 5) {
        pos[i*3]   = (Math.random()-0.5)*2;
        pos[i*3+1] = 1;
        pos[i*3+2] = (Math.random()-0.5)*2;
      }
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleMat.opacity = 0.3 + Math.sin(time)*0.1;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const W2 = canvas.offsetWidth, H2 = canvas.offsetHeight;
    renderer.setSize(W2, H2);
    camera.aspect = W2/H2;
    camera.updateProjectionMatrix();
  });
})();

// ── SIGNATURE THREE.JS ────────────────────────────────────────
(function() {
  const canvas = document.getElementById('signatureCanvas');
  if (!canvas || typeof THREE === 'undefined') return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 100);
  camera.position.set(0, 0, 6);
  // Orbiting spice particles
  const count = 300;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 2 + Math.random() * 1.5;
    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color:0xC9A84C, size:0.05, transparent:true, opacity:0.6 });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  function animate() {
    requestAnimationFrame(animate);
    pts.rotation.y += 0.003;
    pts.rotation.x += 0.001;
    renderer.render(scene, camera);
  }
  animate();
})();

// ── MAGNETIC BUTTON ───────────────────────────────────────────
const ctaBtn = document.getElementById('ctaBtn');
if (ctaBtn) {
  ctaBtn.addEventListener('mousemove', function(e) {
    const rect = this.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width/2;
    const y = e.clientY - rect.top - rect.height/2;
    this.style.transform = `translate(${x*0.3}px,${y*0.3}px)`;
  });
  ctaBtn.addEventListener('mouseleave', function() {
    this.style.transform = '';
  });
}

// ── MENU FILTER ───────────────────────────────────────────────
function filterMenu(cat) {
  const cards = document.querySelectorAll('.menu-card');
  cards.forEach(card => {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.style.display = 'block';
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = '';
    } else {
      card.style.display = 'none';
    }
  });
}

// ── MODAL ─────────────────────────────────────────────────────
const emojis = { 'Dum Biryani':'🍲','Saffron Mutton':'🥘','Seekh Kebab':'🍢','Galouti Kebab':'🥩','Shahi Tukda':'🍮','Gulab Phirni':'🌹' };
function openModal(title, desc, price) {
  const overlay = document.getElementById('menuModal');
  if (!overlay) return;
  document.getElementById('modalEmoji').textContent = emojis[title] || '🍽️';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('modalPrice').textContent = price;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  const overlay = document.getElementById('menuModal');
  if (overlay) overlay.classList.remove('active');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── BOOKING FORM ──────────────────────────────────────────────
function submitBooking() {
  const name = document.getElementById('fname');
  const email = document.getElementById('femail');
  if (name && !name.value.trim()) { name.focus(); return; }
  if (email && !email.value.trim()) { email.focus(); return; }
  const success = document.getElementById('bookingSuccess');
  if (success) {
    success.style.display = 'block';
    if (typeof gsap !== 'undefined') gsap.from(success, { opacity:0, y:20, duration:0.5 });
  }
}

// ── FLOATING LABELS ───────────────────────────────────────────
document.querySelectorAll('.form-group input, .form-group textarea').forEach(input => {
  const label = input.nextElementSibling;
  if (!label) return;
  input.addEventListener('focus', () => { if(label) { label.style.top='-0.5rem';label.style.fontSize='0.75rem';label.style.color='#C9A84C'; } });
  input.addEventListener('blur', () => {
    if (!input.value && label) { label.style.top='1rem';label.style.fontSize='0.9rem';label.style.color='rgba(245,240,232,0.5)'; }
  });
});

// ── SMOOTH SECTION HIGHLIGHT IN NAV ───────────────────────────
const sections = document.querySelectorAll('section[id]');
const navLinks = document.querySelectorAll('.nav-links a');
window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(sec => {
    if (window.scrollY >= sec.offsetTop - 200) current = sec.id;
  });
  navLinks.forEach(a => {
    a.style.color = a.getAttribute('href') === '#'+current ? '#C9A84C' : '';
  });
});

</script>
